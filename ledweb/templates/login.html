<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Acceso al Sistema</title>
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card bg-secondary bg-opacity-10 border-secondary p-4" style="width: 350px;">
        <h3 class="text-center mb-4">LOGIN</h3>
        {% if error %}<div class="alert alert-danger p-2 small">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="username" class="form-control mb-3" placeholder="Usuario" required>
            <input type="password" name="password" class="form-control mb-4" placeholder="Contraseña" required>
            <button type="submit" class="btn btn-primary w-100">ENTRAR</button>
        </form>
    </div>
</body>
</html>
